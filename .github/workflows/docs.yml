# Builds the Sphinx documentation and deploys it to bunny.net, served at
# https://papermodels.structuralpython.com
#
# Repository secrets:
#   BUNNY_STORAGE_PASSWORD  Storage zone password (FTP & API Access > Password)
#   BUNNY_API_KEY           Account API key (used to purge the pull zone cache)
# Repository variables:
#   BUNNY_STORAGE_ZONE      Storage zone name
#   BUNNY_STORAGE_ENDPOINT  Storage API hostname for the zone's region
#                           (e.g. storage.bunnycdn.com, ny.storage.bunnycdn.com)
#   BUNNY_PULL_ZONE_ID      Pull zone id
name: Documentation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: uv sync --group docs
    - name: Build docs
      run: uv run sphinx-build -b html -W --keep-going docs docs/_build/html
    - name: Deploy to bunny.net
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      env:
        BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
        BUNNY_STORAGE_ENDPOINT: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
        BUNNY_PULL_ZONE_ID: ${{ vars.BUNNY_PULL_ZONE_ID }}
        BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
      run: python scripts/deploy_bunny.py docs/_build/html
